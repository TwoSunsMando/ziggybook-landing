server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # QUEUE #27: nginx's own slash redirect (/help -> /help/) must stay
    # relative; absolute it would send http:// links behind Cloudflare.
    absolute_redirect off;

    # Static HTML should never be cached by browsers/CDNs — otherwise
    # users get stale copies after a deploy (iOS Safari is especially
    # aggressive about heuristic caching when no Cache-Control is set).
    # Deploys are small and fast; no caching savings needed for a
    # single-page marketing site.
    location / {
        # Try the URL as-is first, then with a .html suffix so /privacy
        # resolves to /privacy.html, then as a directory, then finally
        # fall back to /index.html so the SPA-style 404 behavior is
        # preserved for the root page.
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # QUEUE #27: help pages. /help/<slug> serves help/<slug>.html; an
    # unknown or not-yet-published slug lands on the help index (never on
    # the marketing page). Same no-cache headers as above.
    location /help/ {
        try_files $uri $uri.html $uri/ /help/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}

# QUEUE #20: www.ziggybook.ai -> apex, one permanent hop. Kept AFTER the
# block above on purpose: the first server is the default for any other
# Host (Coolify's health check, the container's own HEALTHCHECK), so only
# a request that names www is redirected.
server {
    listen 80;
    server_name www.ziggybook.ai;
    return 301 https://ziggybook.ai$request_uri;
}
